# Opt-in (install.sh --sysctl). Kernel-native alternative/complement to memguard's headroom controller:
# make kswapd keep ~1-3 GiB truly free so GPU driver allocations do not stall on page-cache reclaim.
# Default values on DGX OS: min_free_kbytes=45056, watermark_scale_factor=10 (kswapd wakes ~165 MiB).
vm.min_free_kbytes = 1048576
vm.watermark_scale_factor = 200
