# /etc/memguard/memguard.conf - memguard configuration (key = value, '#' comments).
# Sizes: 8G, 512M, 5% (of MemTotal). Durations: 150ms, 2s. Fractions: 0.30 or 30%.
# Every key is optional; the values shown are the defaults. Validate with: memguard check-config

## Sampling
#interval_ms = 50               # decision tick (10..5000). 50 ms = 1.7 GiB per tick at 34 GiB/s bursts
#scan_interval_ms = 2000        # /proc scan cadence when idle
#warn_scan_interval_ms = 250    # /proc scan cadence in WARN/CRITICAL

## Thresholds (MemAvailable based)
#floor = 8G                     # CRITICAL below this. Keep >= 2 ticks of burst (3.4 GiB) + driver reserve
#warn = 16G                     # WARN below this (faster scanning, candidate logging)
#horizon_ms = 150               # kill when MemAvailable is projected to cross the floor within this
#rate_ema_ms = 200              # smoothing of the consumption rate (raw last-tick rate is also used)
#rate_min = 1G                  # per second; projection ignores slower drains
#rate_warn = 4G                 # per second; any drain this fast enters WARN (fast scanning/NVML polling)

## Pressure stall information (/proc/pressure/memory), fractions over psi_window_ms
#psi_window_ms = 1000
#psi_full_critical = 0.30       # thrash: everyone stalled >= 30% of the last second (2 ticks in a row)
#psi_full_emergency = 0.60      # bypass debounce/cooldown
#psi_some_warn = 0.20

## Swap: absolute usage never triggers (it is state, not an event); growth does
#swap_rate_critical = 512M      # per second, combined with low MemAvailable or PSI

## Headroom controller (GB10): the driver needs truly free pages, not reclaimable cache.
#headroom = 4G                  # keep at least this much MemFree by dropping file cache
#headroom_reclaim = true        # uses root memory.reclaim with swappiness=0 (never swaps)

## Actions
#action = kill                  # kill | dry-run
#signal = KILL                  # KILL | TERM (with grace_ms before SIGKILL)
#grace_ms = 0
#kill_mode = auto               # auto | process | tree | cgroup
#cgroup_kill_match = [docker-*.scope, libpod-*.scope, cri-containerd-*.scope, memguard-*.scope]
#stop_unit_after_kill = true    # systemctl stop a system service after killing its process (no Restart= loops)

## Kill gating
#debounce_ticks = 2
#cooldown_ms = 2000
#emergency_cooldown_ms = 500
#verify_ms = 5000               # window to see the victim gone and memory back
#backoff_ms = [10000, 30000, 60000]
#max_kills_per_min = 3
#max_kills_per_10min = 6
#min_victim = 512M              # never kill anything smaller than this

## Victim selection. Lists ADD to the builtin defaults; prefix an entry with ! to remove a builtin.
#never_exe = []                 # builtin: systemd, systemd-*, (sd-pam), init, sshd, dbus-*, memguard
#never_cgroup = [/init.scope]
#avoid_exe = []                 # builtin: Xorg, Xwayland, gnome-shell, gdm*, tmux*, dockerd, containerd*, shells, ...
#prefer_exe = []                # e.g. [python*, ollama*] to bias kills towards your compute jobs
#immune_override_pct = 50       # kill an oom_score_adj=-1000 process anyway if it is the top GPU holder with >= 50% of RAM; 'off' disables
#shmem_weight = 0.5
#growth_weight = 2.0            # score = (footprint + growth_weight * growth_per_second) * weight
#cuda_file_rss_weight = 0       # count this fraction of a CUDA process's file-backed RSS. GPU-populated
                                # cudaMallocManaged pages live there (invisible to NVML), but so do shared
                                # libraries and mmapped model files; set e.g. 1.0 for managed-memory workloads

## Driver generation. 580: cudaMalloc is NOT charged to cgroups (kernel OOM/memcg are blind to it).
#vidmem_charged = auto          # auto conservatively adds GPU usage; yes deduplicates measured cgroup charging; no adds GPU usage
#                              # Set yes only after verifying with memguard doctor --probe. No version-based guessing.

## Misc
#status_file = /run/memguard/status
#log_level = info               # error | warn | info | debug
#mlock = true
#allow_coexist = false          # refuse to run next to systemd-oomd/earlyoom/nohang
